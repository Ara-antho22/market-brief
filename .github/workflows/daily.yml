name: Build daily market brief

on:
  # No GitHub schedule. GitHub's built-in scheduler delays free-tier jobs by
  # hours. The daily run is started by cron-job.org at 6:45am Central instead,
  # through the workflow_dispatch trigger below. The Run workflow button in the
  # Actions tab uses the same trigger.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the brief
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build.py

      - name: Commit and publish
        run: |
          git config user.name "market-brief-bot"
          git config user.email "actions@github.com"
          git add index.html archive.html glossary.html archive/
          git diff --staged --quiet || git commit -m "Brief for $(date -u +%Y-%m-%d)"
          git push
